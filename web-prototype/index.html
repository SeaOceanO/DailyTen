<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe7d6" />
    <meta name="application-name" content="DailyTen" />
    <meta name="apple-mobile-web-app-title" content="DailyTen" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DailyTen · 今日简报</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <script>
      (() => {
        try {
          const hasCurrentThemeChoice = localStorage.getItem('dailyten-web:theme-version') === '2';
          const saved = hasCurrentThemeChoice ? localStorage.getItem('dailyten-web:theme') || 'light' : 'light';
          const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260905-1515" />
  </head>
  <body>
    <main class="shell" aria-labelledby="page-title">
      <header class="topbar">
        <p class="eyebrow">DAILYTEN · 今日简报</p>
        <h1 id="page-title">每日十条</h1>
        <p class="subtitle">替你筛掉大部分新闻，把今天值得知道的十件事讲清楚。</p>
      </header>

      <nav class="channel-tabs" id="channel-tabs" aria-label="内容频道"></nav>

      <section class="date-module" id="date-module" aria-label="日期选择"></section>

      <section class="progress-card" aria-label="阅读进度">
        <div>
          <strong id="progress-title">今日 10 条 · 约 8 分钟</strong>
          <span id="progress-status">先扫读，再展开真正想看的。</span>
        </div>
        <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>
      </section>

      <section class="feed" id="feed" aria-label="今日十条新闻"></section>

      <section class="done-card" id="done-card" hidden>
        今日简报已完成
      </section>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="主导航"></nav>

    <div class="modal-backdrop" id="language-modal" hidden>
      <section class="choice-modal" role="dialog" aria-modal="true" aria-labelledby="language-modal-title">
        <div class="choice-head">
          <h2 id="language-modal-title">语言选择</h2>
          <button class="modal-close" type="button" data-language-close aria-label="关闭">×</button>
        </div>
        <div class="choice-list" id="language-options"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="theme-modal" hidden>
      <section class="choice-modal" role="dialog" aria-modal="true" aria-labelledby="theme-modal-title">
        <div class="choice-head">
          <h2 id="theme-modal-title">主题</h2>
          <button class="modal-close" type="button" data-theme-close aria-label="关闭">×</button>
        </div>
        <div class="choice-list" id="theme-options"></div>
      </section>
    </div>

    <div class="modal-backdrop term-backdrop" id="term-modal" hidden>
      <section class="term-modal" role="dialog" aria-modal="true" aria-labelledby="term-modal-title">
        <button class="modal-close term-close" type="button" data-term-close aria-label="关闭">×</button>
        <p class="term-kicker" id="term-modal-kicker">专业词解释</p>
        <h2 id="term-modal-title">AI</h2>
        <div class="term-body" id="term-modal-body"></div>
      </section>
    </div>

    <script
      src="./app.js?v=20260905-1515"
      onerror="document.getElementById('feed').innerHTML='<article class=&quot;state-card is-error&quot;><strong>页面脚本加载失败</strong><span>请刷新页面后重试。</span></article>'"
    ></script>
  </body>
</html>
