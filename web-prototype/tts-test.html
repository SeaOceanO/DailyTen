<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTS test (temporary)</title>
<body style="font:16px system-ui;padding:16px;line-height:1.6">
<h3>TTS 临时测试</h3>
<button id="go" style="font-size:18px;padding:10px 16px">点这里测试女声</button>
<pre id="out" style="white-space:pre-wrap">等待点击</pre>
<audio id="a" controls style="width:100%"></audio>
<script>
const out=document.getElementById('out'),a=document.getElementById('a');
document.getElementById('go').onclick=async()=>{
  const url='/.netlify/functions/tts?'+new URLSearchParams({lang:'zh',voice:'female',text:'热点1：你好，这是女声测试。OpenAI 发布了新模型。'});
  out.textContent='请求中…';
  try{
    const r=await fetch(url);
    const type=r.headers.get('content-type');
    const buf=await r.arrayBuffer();
    out.textContent='fetch 状态: '+r.status+'\ncontent-type: '+type+'\n大小: '+buf.byteLength+' 字节\n';
    if(!r.ok){out.textContent+='返回内容: '+new TextDecoder().decode(buf).slice(0,300);return;}
    a.src=URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));
    try{await a.play();out.textContent+='fetch+blob 播放: 成功\n';}catch(e){out.textContent+='fetch+blob 播放失败: '+e.message+'\n';}
    const b=new Audio(url);
    b.onerror=()=>{out.textContent+='直接 src 播放: 失败 (code '+(b.error&&b.error.code)+')\n'};
    b.onplaying=()=>{out.textContent+='直接 src 播放: 成功\n'};
    setTimeout(()=>b.play().catch(e=>out.textContent+='直接 src play() 被拒: '+e.message+'\n'),4000);
  }catch(e){out.textContent='异常: '+e.message}
};
</script>
