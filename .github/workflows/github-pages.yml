name: Deploy DailyTen Web

on:
  push:
    branches:
      - main
    paths:
      - 'web-prototype/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Keep the natural-voice audio from the live site; a code-only deploy must not drop it.
      - name: Carry over existing audio
        continue-on-error: true
        run: node web-prototype/scripts/carry-over-audio.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-prototype

      - id: deployment
        uses: actions/deploy-pages@v4
